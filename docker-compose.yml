services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - DATA_DIR=/app/data
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
